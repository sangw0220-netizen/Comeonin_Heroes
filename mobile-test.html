<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comeonin Heroes - Device Test</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0811;color:#eee;font-family:Arial,"Noto Sans KR",sans-serif}
    body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:14px 18px 18px;overflow:auto}

    .test-panel{width:min(96vw,980px);margin-bottom:12px;padding:12px 14px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:linear-gradient(180deg,#181120,#100c17);box-shadow:0 12px 36px rgba(0,0,0,.28)}
    .panel-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .panel-title{font-size:14px;font-weight:900;color:#f5e9ff}
    .current-size{font-size:11px;color:#d9c6ff;padding:5px 8px;border-radius:999px;background:rgba(169,122,232,.12);border:1px solid rgba(190,150,244,.18);white-space:nowrap}

    .toolbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
    .field{display:flex;flex-direction:column;gap:4px;min-width:230px;flex:1 1 300px}
    .label{font-size:10px;color:#a99fb5;font-weight:800}
    .toolbar select,.toolbar button{height:36px;border:1px solid rgba(255,255,255,.16);background:#21182f;color:#f4effc;border-radius:8px;padding:0 11px;font-weight:800;cursor:pointer}
    .toolbar select:hover,.toolbar button:hover{background:#302143;border-color:rgba(220,190,255,.28)}
    .toolbar button{flex:0 0 auto}
    .device-note{margin-top:8px;font-size:9px;line-height:1.45;color:#746c80}

    .preview-area{width:100%;display:flex;align-items:flex-start;justify-content:center;min-height:300px}
    .device-shell{position:relative;padding:10px;border-radius:28px;background:#17111f;border:1px solid rgba(255,255,255,.18);box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 0 2px rgba(160,120,220,.08) inset;transition:width .15s ease,height .15s ease,border-radius .15s ease}
    .device-shell.phone::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:72px;height:4px;border-radius:99px;background:rgba(255,255,255,.14);z-index:2}
    .device-shell.tablet{border-radius:18px;padding:9px}
    .device-shell.tablet::before{content:"";position:absolute;top:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18);z-index:2}

    #gameFrame{display:block;width:390px;height:844px;border:0;border-radius:18px;background:#000;transform-origin:top left}
    .device-shell.tablet #gameFrame{border-radius:10px}
    .hint{margin-top:10px;font-size:10px;color:#8d839c;text-align:center;line-height:1.5}

    @media(max-width:700px){
      body{padding:8px}
      .test-panel{padding:10px}
      .panel-top{align-items:flex-start;flex-direction:column}
      .field{min-width:100%;flex-basis:100%}
      .toolbar button{flex:1 1 150px}
    }
    @media(max-width:520px){
      body{padding:0;justify-content:flex-start}
      .test-panel,.hint{display:none}
      .preview-area{min-height:100vh}
      .device-shell{padding:0;border:0;border-radius:0;width:100vw!important;height:100vh!important;box-shadow:none}
      .device-shell::before{display:none!important}
      #gameFrame{width:100vw!important;height:100vh!important;border-radius:0!important;transform:none!important}
    }
  </style>
</head>
<body>
  <div class="test-panel">
    <div class="panel-top">
      <div class="panel-title">📱 Comeonin Heroes · 기기 화면 테스트</div>
      <div class="current-size" id="currentSize">390 × 844 · 세로</div>
    </div>

    <div class="toolbar">
      <label class="field">
        <span class="label">테스트 기기 프리셋</span>
        <select id="preset">
          <optgroup label="Samsung Galaxy · Android">
            <option value="360x780" data-type="phone">Galaxy S23 / S24 / S25 계열 · 360 × 780</option>
            <option value="384x832" data-type="phone">Galaxy S Plus 계열 · 384 × 832</option>
            <option value="412x915" data-type="phone">Galaxy Ultra / 대화면 Android · 412 × 915</option>
            <option value="412x892" data-type="phone">Galaxy A 계열 · 412 × 892</option>
            <option value="360x800" data-type="phone">일반 소형 Android · 360 × 800</option>
          </optgroup>

          <optgroup label="Apple iPhone">
            <option value="375x667" data-type="phone">iPhone SE · 375 × 667</option>
            <option value="390x844" data-type="phone" selected>iPhone 13 / 14 계열 · 390 × 844</option>
            <option value="393x852" data-type="phone">iPhone 15 / 16 계열 · 393 × 852</option>
            <option value="402x874" data-type="phone">iPhone Pro 대화면 · 402 × 874</option>
            <option value="430x932" data-type="phone">iPhone 14/15 Pro Max 계열 · 430 × 932</option>
            <option value="440x956" data-type="phone">iPhone 16 Pro Max 계열 · 440 × 956</option>
          </optgroup>

          <optgroup label="Tablet · Android / iPad">
            <option value="800x1280" data-type="tablet">일반 Android 태블릿 · 800 × 1280</option>
            <option value="800x1280" data-type="tablet">Galaxy Tab S 계열 · 800 × 1280</option>
            <option value="820x1180" data-type="tablet">iPad 10세대 계열 · 820 × 1180</option>
            <option value="834x1194" data-type="tablet">iPad Pro 11형 계열 · 834 × 1194</option>
            <option value="1024x1366" data-type="tablet">iPad Pro 12.9 / 13형 계열 · 1024 × 1366</option>
          </optgroup>

          <optgroup label="범용 반응형 확인">
            <option value="320x568" data-type="phone">최소 모바일 점검 · 320 × 568</option>
            <option value="360x640" data-type="phone">좁은 화면 점검 · 360 × 640</option>
            <option value="768x1024" data-type="tablet">일반 태블릿 4:3 · 768 × 1024</option>
          </optgroup>
        </select>
      </label>

      <button id="rotateBtn" type="button">↔ 가로 / 세로</button>
      <button id="reloadBtn" type="button">↻ 게임 새로고침</button>
      <button id="resetBtn" type="button">기본 크기</button>
    </div>

    <div class="device-note">
      ※ 브라우저의 CSS viewport 기준 테스트용 프리셋입니다. 실제 기기는 브라우저 UI, 배율, OS 설정에 따라 몇 px 정도 차이가 날 수 있습니다.
    </div>
  </div>

  <div class="preview-area" id="previewArea">
    <div class="device-shell phone" id="deviceShell">
      <iframe id="gameFrame" src="index.html" title="Comeonin Heroes device preview" allow="autoplay; fullscreen"></iframe>
    </div>
  </div>

  <div class="hint">
    PC 테스트 전용 화면입니다. 실제 게임 실행/배포는 <b>index.html</b>을 사용하세요.<br>
    화면이 PC 창보다 큰 경우 자동으로 축소해서 보여주지만, 게임 내부에는 선택한 기기 크기가 그대로 적용됩니다.
  </div>

  <script>
    const frame=document.getElementById('gameFrame');
    const preset=document.getElementById('preset');
    const shell=document.getElementById('deviceShell');
    const currentSize=document.getElementById('currentSize');
    let rotated=false;

    function getPreset(){
      const option=preset.options[preset.selectedIndex];
      const [pw,ph]=option.value.split('x').map(Number);
      return {pw,ph,type:option.dataset.type||'phone',label:option.textContent.trim()};
    }

    function applySize(){
      const p=getPreset();
      const w=rotated?p.ph:p.pw;
      const h=rotated?p.pw:p.ph;

      frame.style.width=w+'px';
      frame.style.height=h+'px';
      shell.classList.toggle('tablet',p.type==='tablet');
      shell.classList.toggle('phone',p.type!=='tablet');

      fitToScreen(w,h);
      currentSize.textContent=`${w} × ${h} · ${rotated?'가로':'세로'}`;
      document.title=`Comeonin Heroes - ${w}x${h} Test`;
    }

    function fitToScreen(w,h){
      const panel=document.querySelector('.test-panel');
      const panelH=(panel?.offsetHeight||105)+28;
      const maxW=Math.max(280,window.innerWidth-36);
      const maxH=Math.max(300,window.innerHeight-panelH-48);
      const shellPad=20;
      const scale=Math.min(1,maxW/(w+shellPad),maxH/(h+shellPad));

      frame.style.transform=`scale(${scale})`;
      shell.style.width=(w*scale+shellPad)+'px';
      shell.style.height=(h*scale+shellPad)+'px';
    }

    preset.addEventListener('change',()=>{
      rotated=false;
      applySize();
    });

    document.getElementById('reloadBtn').addEventListener('click',()=>{
      try{ frame.contentWindow.location.reload(); }
      catch(_){ frame.src='index.html?reload='+Date.now(); }
    });

    document.getElementById('rotateBtn').addEventListener('click',()=>{
      rotated=!rotated;
      applySize();
    });

    document.getElementById('resetBtn').addEventListener('click',()=>{
      preset.value='390x844';
      rotated=false;
      applySize();
    });

    window.addEventListener('resize',applySize);
    applySize();
  </script>
</body>
</html>
