<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advanced Tower Defense - Final</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 20px;
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex; 
            flex-direction: row; 
            gap: 20px; justify-content: center; align-items: flex-start;
        }
        
        #gameArea { 
            position: relative; 
            width: 100%;
            max-width: 800px; 
            display: flex;
            justify-content: center;
        }
        
        canvas {
            width: 100%; 
            height: auto;
            aspect-ratio: 1 / 1;
            border: 6px solid #16213e; border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
            touch-action: none; 
        }
        
        #uiPanel {
            width: 420px;
            background: #16213e; border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-height: 90vh; 
        }
        
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; color: white; }
        .btn-upgrade { background: #f39c12; } .btn-upgrade:hover { background: #f1c40f; }
        .btn-sell { background: #c0392b; } .btn-sell:hover { background: #e74c3c; }
        .btn:disabled { background: #7f8c8d; cursor: not-allowed; box-shadow: none; color: #bdc3c7;}
        
        .section-title { padding: 10px 15px; font-size: 14px; color: #a9b0c0; border-bottom: 2px solid #0f3460; background: #1a1a2e; }
        
        #buildMenu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; overflow-y: auto; flex-grow: 1; min-height: 200px; }
        .tower-card { background: #0f3460; border: 2px solid transparent; border-radius: 8px; padding: 10px; cursor: pointer; transition: 0.2s; font-size: 12px; }
        .tower-card:hover { background: #194a8d; } .tower-card.selected { border: 2px solid #e94560; background: #1a1a2e; }
        .tower-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; display:flex; align-items:center; }
        .color-dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; display:inline-block; }
        
        #contextMenu { padding: 15px; background: #0f3460; display: none; flex-direction: column; gap: 10px; }
        
        #messageBox { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5vw; font-weight: 900; color: #fff; text-shadow: 0 0 10px #e94560, 2px 2px 0 #000; pointer-events: none; text-align: center; width: 100%; white-space: nowrap;}
        
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #16213e; } ::-webkit-scrollbar-thumb { background: #e94560; border-radius: 4px; }
        
        @media (max-width: 900px), (orientation: portrait) {
            body { flex-direction: column; align-items: center; padding: 10px; }
            #uiPanel {
                width: 100%; 
                max-width: 800px;
                max-height: 50vh; 
            }
            #messageBox { font-size: 40px; }
        }
    </style>
</head>
<body>

<div id="gameArea">
    <canvas id="gameCanvas" width="800" height="800"></canvas>
    <div id="messageBox"></div>
</div>

<div id="uiPanel">
    <div id="contextMenu">
        <div style="font-size: 16px; font-weight: bold;" id="ctxTitle">타워 정보</div>
        <div id="ctxStats" style="font-size: 13px; color: #bdc3c7;"></div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-upgrade" id="upgradeBtn" onclick="upgradeSelected()">업그레이드</button>
            <button class="btn btn-sell" id="sellBtn" onclick="sellSelected()">철거</button>
        </div>
    </div>

    <div class="section-title">건설 메뉴 (설치: 빈 공간 터치 / 선택: 설치된 타워 터치)</div>
    <div id="buildMenu"></div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const elMsg = document.getElementById('messageBox');
    const ctxMenu = document.getElementById('contextMenu');
    const ctxTitle = document.getElementById('ctxTitle');
    const ctxStats = document.getElementById('ctxStats');
    const upgradeBtn = document.getElementById('upgradeBtn');
    const sellBtn = document.getElementById('sellBtn');

    let gold = 1500;
    let lives = 10;
    let wave = 0;
    let maxWaves = 10;
    let state = 'PREP'; 
    let timer = 60;
    
    let buildings = []; 
    let enemies = [];
    let projectiles = [];
    let floatingTexts = [];
    
    const center = { x: 400, y: 400, radius: 45 };
    let mouse = { x: -100, y: -100 }; 
    let isHoverStartBtn = false;
    
    let selectedBuildId = 0; 
    let selectedPlacedBuilding = null; 

    // 테마 및 배경 생성
    const themes = [
        { name: 'Grass', bg: '#27ae60', detail: '#2ecc71', center: '#2980b9' },
        { name: 'Desert', bg: '#d35400', detail: '#e67e22', center: '#8e44ad' },
        { name: 'Lava', bg: '#c0392b', detail: '#e74c3c', center: '#2c3e50' }
    ];
    const currentTheme = themes[Math.floor(Math.random() * themes.length)];
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = 800; bgCanvas.height = 800;
    const bgCtx = bgCanvas.getContext('2d');
    
    // ==========================================
    // 💡 테마별 오브젝트 그리기 헬퍼 함수들
    // ==========================================
    function drawTree(ctx, x, y, size) {
        // 나무 기둥
        ctx.fillStyle = '#5c4033';
        ctx.fillRect(x - size*0.15, y, size*0.3, size*0.8);
        // 나뭇잎 (3단 겹침)
        ctx.fillStyle = '#228B22'; // 짙은 초록색
        ctx.beginPath(); ctx.arc(x, y - size*0.4, size*0.7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x - size*0.4, y + size*0.1, size*0.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + size*0.4, y + size*0.1, size*0.5, 0, Math.PI*2); ctx.fill();
        // 하이라이트 (밝은 부분)
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath(); ctx.arc(x - size*0.2, y - size*0.5, size*0.3, 0, Math.PI*2); ctx.fill();
    }

    function drawRock(ctx, x, y, size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, y - size*0.8);
        ctx.lineTo(x + size*0.8, y - size*0.2);
        ctx.lineTo(x + size*0.6, y + size*0.5);
        ctx.lineTo(x - size*0.5, y + size*0.6);
        ctx.lineTo(x - size*0.9, y + size*0.1);
        ctx.closePath();
        ctx.fill();
        // 바위 음영(그림자) 효과
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.moveTo(x, y - size*0.8);
        ctx.lineTo(x + size*0.8, y - size*0.2);
        ctx.lineTo(x + size*0.6, y + size*0.5);
        ctx.lineTo(x, y + size*0.5);
        ctx.closePath();
        ctx.fill();
    }

    function drawPyramid(ctx, x, y, size) {
        // 밝은 면
        ctx.fillStyle = '#f1c40f'; 
        ctx.beginPath();
        ctx.moveTo(x, y - size); ctx.lineTo(x + size, y + size*0.5); ctx.lineTo(x - size, y + size*0.5);
        ctx.closePath(); ctx.fill();
        // 어두운 면 (입체감)
        ctx.fillStyle = '#d35400';
        ctx.beginPath();
        ctx.moveTo(x, y - size); ctx.lineTo(x + size, y + size*0.5); ctx.lineTo(x, y + size*0.5);
        ctx.closePath(); ctx.fill();
        // 가로 줄무늬 (벽돌 느낌)
        ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x-size*0.6, y); ctx.lineTo(x+size*0.6, y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x-size*0.3, y-size*0.5); ctx.lineTo(x+size*0.3, y-size*0.5); ctx.stroke();
    }

    function drawCactus(ctx, x, y, size) {
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(x - size*0.15, y - size, size*0.3, size*1.5); // 몸통
        ctx.fillRect(x - size*0.6, y - size*0.3, size*0.6, size*0.25); // 왼쪽 팔
        ctx.fillRect(x - size*0.6, y - size*0.6, size*0.2, size*0.4);
        ctx.fillRect(x + size*0.15, y, size*0.5, size*0.25); // 오른쪽 팔
        ctx.fillRect(x + size*0.45, y - size*0.4, size*0.2, size*0.5);
    }

    function drawPuddle(ctx, x, y, size, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        // 랜덤한 형태의 웅덩이 생성
        for(let i=0; i<Math.PI*2; i+=Math.PI/4) {
            let r = size * (0.7 + Math.random()*0.3);
            ctx.lineTo(x + Math.cos(i)*r, y + Math.sin(i)*r*0.6); // 세로로 살짝 납작하게
        }
        ctx.closePath(); ctx.fill();
        // 웅덩이 내부 디테일 (밝은 결)
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.beginPath(); ctx.ellipse(x, y, size*0.5, size*0.3, 0, 0, Math.PI*2); ctx.fill();
    }

    function drawCrater(ctx, x, y, size) {
        // 크레이터 외곽
        ctx.fillStyle = '#78281f';
        ctx.beginPath(); ctx.ellipse(x, y, size, size*0.7, 0, 0, Math.PI*2); ctx.fill();
        // 크레이터 내부 (깊이감)
        ctx.fillStyle = '#4a2311';
        ctx.beginPath(); ctx.ellipse(x, y + size*0.1, size*0.8, size*0.5, 0, 0, Math.PI*2); ctx.fill();
    }

    // ==========================================
    // 💡 테마별 맵 생성 메인 함수
    // ==========================================
    function generateBackground() {
        // 1. 기본 배경색 칠하기
        bgCtx.fillStyle = currentTheme.bg;
        bgCtx.fillRect(0, 0, 800, 800);
        
        // 2. 바닥 디테일 (작은 점들)
        bgCtx.fillStyle = currentTheme.detail;
        for(let i=0; i<200; i++) {
            bgCtx.beginPath();
            bgCtx.arc(Math.random()*800, Math.random()*800, Math.random()*3+1, 0, Math.PI*2);
            bgCtx.fill();
        }

        // 3. 그리드 선 (배경물 아래에 깔림)
        bgCtx.strokeStyle = "rgba(0,0,0,0.07)";
        for(let i=0; i<=800; i+=40) {
            bgCtx.beginPath(); bgCtx.moveTo(i, 0); bgCtx.lineTo(i, 800); bgCtx.stroke();
            bgCtx.beginPath(); bgCtx.moveTo(0, i); bgCtx.lineTo(800, i); bgCtx.stroke();
        }

        // 4. 테마별 오브젝트 무작위 배치 (시드 랜덤)
        let numObjects = 35 + Math.floor(Math.random() * 20); // 35~55개의 오브젝트 배치
        
        for (let i = 0; i < numObjects; i++) {
            let ox = Math.random() * 800;
            let oy = Math.random() * 800;
            let size = 15 + Math.random() * 25; // 크기 다양화

            // 중앙 기지 근처에는 오브젝트 생성 안 함 (시야 확보)
            if (Math.hypot(ox - center.x, oy - center.y) < 120) continue;
            // 상단 HUD 영역에도 큼지막한 건 피함
            if (oy < 80) continue;

            let rand = Math.random();

            if (currentTheme.name === 'Grass') {
                // 초원: 웅덩이(강), 나무, 이끼 낀 바위
                if (rand < 0.2) drawPuddle(bgCtx, ox, oy, size * 2, '#3498db');
                else if (rand < 0.7) drawTree(bgCtx, ox, oy, size);
                else drawRock(bgCtx, ox, oy, size, '#7f8c8d');
                
            } else if (currentTheme.name === 'Desert') {
                // 사막: 피라미드, 선인장, 사암 바위
                if (rand < 0.15) drawPyramid(bgCtx, ox, oy, size * 1.5);
                else if (rand < 0.5) drawCactus(bgCtx, ox, oy, size * 0.8);
                else drawRock(bgCtx, ox, oy, size, '#b8860b');
                
            } else if (currentTheme.name === 'Lava') {
                // 용암: 마그마 웅덩이, 흑요석 바위, 크레이터 분화구
                if (rand < 0.3) drawPuddle(bgCtx, ox, oy, size * 2, '#d35400');
                else if (rand < 0.6) drawCrater(bgCtx, ox, oy, size);
                else drawRock(bgCtx, ox, oy, size, '#2c3e50');
            }
        }
    }
    generateBackground();

    // 21종 타워 데이터
    const towerDefs = [
        { id: 0, name: "1. 일반 포탑", cost: 50, range: 130, dmg: 10, cd: 1.0, type: "normal", shape: "circle", color: "#ecf0f1", desc: "기본 방어탑" },
        { id: 1, name: "2. 속사 포탑", cost: 100, range: 110, dmg: 5, cd: 0.25, type: "normal", shape: "triangle", color: "#bdc3c7", desc: "빠른 공격속도" },
        { id: 2, name: "3. 스나이퍼", cost: 150, range: 350, dmg: 50, cd: 2.2, type: "normal", shape: "diamond", color: "#34495e", desc: "초장거리 저격" },
        { id: 3, name: "4. 얼음 방사기", cost: 120, range: 120, dmg: 2, cd: 1.2, type: "slow", slow: 0.5, shape: "hexagon", color: "#3498db", desc: "적 이속 50% 감소" },
        { id: 4, name: "5. 맹독 탑", cost: 130, range: 120, dmg: 2, cd: 1.0, type: "poison", dot: 5, shape: "triangle", color: "#2ecc71", desc: "지속 독 피해" },
        { id: 5, name: "6. 대포", cost: 200, range: 160, dmg: 25, cd: 2.0, type: "splash", splashR: 50, shape: "square", color: "#e74c3c", desc: "좁은 범위 폭발" },
        { id: 6, name: "7. 가시밭", cost: 90, range: 80, dmg: 35, cd: 0.8, type: "normal", shape: "star", color: "#d35400", desc: "근접 폭딜" },
        { id: 7, name: "8. 레이저", cost: 250, range: 200, dmg: 18, cd: 0.5, type: "instant", shape: "diamond", color: "#9b59b6", desc: "즉발 빔 공격" },
        { id: 8, name: "9. 샷건", cost: 180, range: 100, dmg: 45, cd: 1.2, type: "normal", shape: "hexagon", color: "#f39c12", desc: "근거리 강력 폭딜" },
        { id: 9, name: "10. 지진 발생기", cost: 220, range: 100, dmg: 15, cd: 1.5, type: "splash", splashR: 100, shape: "circle", color: "#8e44ad", desc: "주변 넓은 광역기" },
        { id: 10, name: "11. 극저온 탑", cost: 300, range: 150, dmg: 5, cd: 1.0, type: "slow", slow: 0.2, shape: "star", color: "#00a8ff", desc: "이속 80% 감소" },
        { id: 11, name: "12. 화염 방사기", cost: 350, range: 120, dmg: 8, cd: 0.1, type: "normal", shape: "triangle", color: "#e84118", desc: "초고속 화염 연사" },
        { id: 12, name: "13. 역병 탑", cost: 260, range: 150, dmg: 5, cd: 0.8, type: "poison", dot: 15, shape: "hexagon", color: "#4cd137", desc: "강력한 독 중독" },
        { id: 13, name: "14. 미사일 벙커", cost: 400, range: 450, dmg: 80, cd: 3.0, type: "splash", splashR: 70, shape: "square", color: "#2f3640", desc: "초장거리 광역 폭격" },
        { id: 14, name: "15. 아케인 크리스탈", cost: 300, range: 190, dmg: 50, cd: 1.2, type: "normal", shape: "diamond", color: "#8c7ae6", desc: "안정적 중거리 마법" },
        { id: 15, name: "16. 금광", cost: 300, range: 0, dmg: 0, cd: 3.0, type: "economy", income: 20, shape: "coin", color: "#f1c40f", desc: "3초마다 20골드 생성" },
        { id: 16, name: "17. 발칸포", cost: 500, range: 170, dmg: 15, cd: 0.08, type: "normal", shape: "square", color: "#718093", desc: "경이로운 연사력" },
        { id: 17, name: "18. 플라즈마", cost: 600, range: 230, dmg: 100, cd: 1.5, type: "splash", splashR: 80, shape: "star", color: "#00cec9", desc: "강력한 광역 플라즈마" },
        { id: 18, name: "19. 심연의 눈", cost: 800, range: 220, dmg: 180, cd: 2.0, type: "normal", shape: "diamond", color: "#2c2c54", desc: "보스 킬러용 극강 딜" },
        { id: 19, name: "20. 위성 타격기", cost: 1500, range: 600, dmg: 500, cd: 4.0, type: "splash", splashR: 150, shape: "hexagon", color: "#fff", desc: "최종병기. 맵 장악" },
        { id: 20, name: "21. 강철 바리게이트", cost: 50, range: 0, dmg: 0, cd: 0, type: "barricade", hp: 1000, shape: "wall", color: "#7f8c8d", desc: "적의 이동경로를 방해 (체력 1000)" }
    ];

    const buildMenu = document.getElementById('buildMenu');
    towerDefs.forEach(t => {
        const div = document.createElement('div');
        div.className = 'tower-card' + (t.id === 0 ? ' selected' : '');
        div.innerHTML = `
            <div class="tower-title"><span class="color-dot" style="background:${t.color}"></span>${t.name}</div>
            <div>💰 ${t.cost}g | ${t.type === 'barricade' ? '방어물' : `사거리: ${t.range}`}</div>
            <div style="color:#a9b0c0; margin-top:4px;">${t.desc}</div>
        `;
        div.onclick = () => {
            document.querySelectorAll('.tower-card').forEach(c => c.classList.remove('selected'));
            div.classList.add('selected');
            selectedBuildId = t.id;
            selectedPlacedBuilding = null; 
            updateContextUI();
        };
        buildMenu.appendChild(div);
    });

    const enemyTemplates = [
        { type: 'Normal', hpMulti: 1.0, speed: 45, radius: 10, color: '#e74c3c' },
        { type: 'Speed', hpMulti: 0.6, speed: 80, radius: 8, color: '#f1c40f' },
        { type: 'Tank', hpMulti: 3.0, speed: 25, radius: 15, color: '#8e44ad' },
        { type: 'Boss', hpMulti: 10.0, speed: 20, radius: 25, color: '#c0392b' }
    ];

    let enemiesToSpawn = [];
    let spawnTimer = 0;
    
    function forceStartWave() {
        if (state === 'PREP') timer = 0;
    }

    function startNextWave() {
        if (wave >= maxWaves) {
            state = 'WIN';
            elMsg.innerText = "VICTORY!";
            elMsg.style.color = "#2ecc71";
            return;
        }
        wave++;
        state = 'PLAYING';
        
        let baseHp = 40 * Math.pow(1.5, wave);
        let count = 10 + (wave * 5);
        enemiesToSpawn = [];
        
        for(let i=0; i<count; i++) {
            let t = enemyTemplates[0]; 
            let rand = Math.random();
            if (wave > 2 && rand < 0.3) t = enemyTemplates[1]; 
            if (wave > 4 && rand < 0.6 && rand > 0.3) t = enemyTemplates[2]; 
            if (wave % 5 === 0 && i === 0) t = enemyTemplates[3]; 
            
            enemiesToSpawn.push({
                ...t,
                maxHp: baseHp * t.hpMulti,
                hp: baseHp * t.hpMulti,
                reward: t.type === 'Boss' ? 50 : (4 + Math.floor(wave/2))
            });
        }
    }

    function getRandomEdgeSpawn() {
        let edge = Math.floor(Math.random() * 4);
        let x, y;
        if (edge === 0) { x = Math.random()*800; y = -20; }
        else if (edge === 1) { x = Math.random()*800; y = 820; }
        else if (edge === 2) { x = -20; y = Math.random()*800; }
        else { x = 820; y = Math.random()*800; }
        return {x, y};
    }

    // 마우스 및 터치 이벤트 처리
    function updatePointerPos(evt) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        let clientX = evt.clientX;
        let clientY = evt.clientY;
        
        if (evt.touches && evt.touches.length > 0) {
            clientX = evt.touches[0].clientX;
            clientY = evt.touches[0].clientY;
        }

        mouse.x = (clientX - rect.left) * scaleX;
        mouse.y = (clientY - rect.top) * scaleY;

        isHoverStartBtn = (mouse.x >= 630 && mouse.x <= 770 && mouse.y >= 15 && mouse.y <= 55);
        canvas.style.cursor = (isHoverStartBtn && state === 'PREP') ? 'pointer' : 'crosshair';
    }

    function handleCanvasInteract() {
        if (state === 'GAMEOVER' || state === 'WIN') return;
        
        if (mouse.y <= 70) {
            if (state === 'PREP' && isHoverStartBtn) forceStartWave();
            return; 
        }

        let clickedBuilding = null;
        for (let b of buildings) {
            if (Math.hypot(b.x - mouse.x, b.y - mouse.y) < b.r + 5) {
                clickedBuilding = b;
                break;
            }
        }

        if (clickedBuilding) {
            selectedPlacedBuilding = clickedBuilding;
            updateContextUI();
            return;
        }

        if (Math.hypot(center.x - mouse.x, center.y - mouse.y) < center.radius + 20) {
            addFloatingText("중앙 기지 건설 불가", mouse.x, mouse.y, "#e74c3c");
            return;
        }

        const tDef = towerDefs.find(t => t.id === selectedBuildId);
        
        if (gold >= tDef.cost) {
            let overlap = false;
            for (let b of buildings) {
                if (Math.hypot(b.x - mouse.x, b.y - mouse.y) < b.r + 20) overlap = true;
            }
            if (!overlap) {
                gold -= tDef.cost;
                buildings.push({
                    id: Math.random(), x: mouse.x, y: mouse.y, r: 20,
                    typeData: tDef, level: 1, cdTimer: 0,
                    totalCost: tDef.cost, hp: tDef.hp || 0, maxHp: tDef.hp || 0
                });
                selectedPlacedBuilding = null;
                updateContextUI();
            } else {
                addFloatingText("공간 부족!", mouse.x, mouse.y, "#e74c3c");
            }
        } else {
            addFloatingText("골드 부족!", mouse.x, mouse.y, "#e74c3c");
        }
    }

    canvas.addEventListener('mousemove', updatePointerPos);
    canvas.addEventListener('mouseleave', () => { mouse.x = -100; mouse.y = -100; isHoverStartBtn = false; });
    canvas.addEventListener('mousedown', (e) => { 
        updatePointerPos(e);
        handleCanvasInteract();
    });

    canvas.addEventListener('touchmove', (e) => { 
        e.preventDefault(); 
        updatePointerPos(e); 
    }, { passive: false });
    
    canvas.addEventListener('touchstart', (e) => { 
        e.preventDefault(); 
        updatePointerPos(e);
        handleCanvasInteract();
    }, { passive: false });

    // UI 메뉴 업데이트
    function updateContextUI() {
        if (selectedPlacedBuilding) {
            ctxMenu.style.display = 'flex';
            let b = selectedPlacedBuilding;
            let d = b.typeData;
            ctxTitle.innerHTML = `<span class="color-dot" style="background:${d.color}"></span>${d.name} (Lv.${b.level})`;
            
            if (d.type === 'barricade') {
                ctxStats.innerHTML = `체력: ${Math.floor(b.hp)} / ${b.maxHp}`;
                upgradeBtn.disabled = true;
                upgradeBtn.innerText = "업그레이드 불가";
            } else {
                ctxStats.innerHTML = `공격력: ${Math.floor(d.dmg * Math.pow(1.5, b.level-1))} | 사거리: ${Math.floor(d.range * Math.pow(1.1, b.level-1))}`;
                if (b.level < 3) {
                    let upCost = Math.floor(d.cost * b.level * 1.5);
                    upgradeBtn.disabled = gold < upCost;
                    upgradeBtn.innerText = `업그레이드 (${upCost}g)`;
                    upgradeBtn.onclick = () => {
                        if (gold >= upCost) {
                            gold -= upCost;
                            b.level++;
                            b.r += 5; // 💡 업그레이드 시 타워 크기(반지름)가 5씩 커집니다! (기본20 -> 25 -> 30)
                            b.totalCost += upCost;
                            addFloatingText("Level Up!", b.x, b.y - 20, "#f1c40f");
                            updateContextUI();
                        }
                    };
                } else {
                    upgradeBtn.disabled = true;
                    upgradeBtn.innerText = "최대 레벨 (MAX)";
                }
            }
            
            let refund = Math.floor(b.totalCost * 0.9);
            sellBtn.innerText = `철거 (+${refund}g)`;
            sellBtn.onclick = () => {
                gold += refund;
                buildings = buildings.filter(x => x.id !== b.id);
                selectedPlacedBuilding = null;
                addFloatingText(`+${refund}g`, b.x, b.y, "#f1c40f");
                updateContextUI();
            };
        } else {
            ctxMenu.style.display = 'none';
        }
    }

    function addFloatingText(text, x, y, color) {
        floatingTexts.push({ text, x, y, color, life: 1.0 });
    }

    // 게임 루프
    let lastTime = performance.now();
    function loop() {
        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000.0, 0.1);
        lastTime = now;

        update(dt);
        draw();
        updateUI(); 

        requestAnimationFrame(loop);
    }

    function update(dt) {
        if (state === 'GAMEOVER' || state === 'WIN') return;

        if (state === 'PREP') {
            timer -= dt;
            if (timer <= 0) startNextWave();
        } else if (state === 'PLAYING') {
            if (enemiesToSpawn.length > 0) {
                spawnTimer -= dt;
                if (spawnTimer <= 0) {
                    let eData = enemiesToSpawn.pop();
                    let pos = getRandomEdgeSpawn();
                    enemies.push({
                        ...eData, x: pos.x, y: pos.y,
                        slowTimer: 0, slowFactor: 1.0, poisonTimer: 0, poisonDmg: 0
                    });
                    spawnTimer = Math.max(0.1, 1.0 - (wave * 0.05));
                }
            } else if (enemies.length === 0) {
                state = 'PREP';
                timer = 10;
                gold += wave * 50; 
                addFloatingText(`웨이브 클리어! +${wave*50}g`, center.x, center.y-50, "#f1c40f");
            }
        }

        // 적군 업데이트
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            
            if (e.poisonTimer > 0) {
                e.poisonTimer -= dt;
                e.hp -= e.poisonDmg * dt;
            }

            let dx = center.x - e.x;
            let dy = center.y - e.y;
            let dist = Math.hypot(dx, dy);
            
            if (dist < center.radius) {
                lives--;
                addFloatingText("-1 ❤️", center.x, center.y, "#e74c3c");
                enemies.splice(i, 1);
                if (lives <= 0) {
                    state = 'GAMEOVER';
                    elMsg.innerText = "GAME OVER";
                }
                continue;
            }

            let currentSpeed = e.speed;
            if (e.slowTimer > 0) {
                e.slowTimer -= dt;
                currentSpeed *= e.slowFactor;
            }

            let vx = (dx / dist) * currentSpeed * dt;
            let vy = (dy / dist) * currentSpeed * dt;

            for (let b of buildings) {
                let bdx = e.x - b.x;
                let bdy = e.y - b.y;
                let bDist = Math.hypot(bdx, bdy);
                let minDist = e.radius + b.r;
                
                if (bDist < minDist) {
                    let overlap = minDist - bDist;
                    e.x += (bdx / bDist) * overlap;
                    e.y += (bdy / bDist) * overlap;
                    
                    if (b.typeData.type === 'barricade') b.hp -= 20 * dt; 
                }
            }

            e.x += vx;
            e.y += vy;

            if (e.hp <= 0) {
                gold += e.reward;
                addFloatingText(`+${e.reward}`, e.x, e.y, "#f1c40f");
                enemies.splice(i, 1);
                if(selectedPlacedBuilding && selectedPlacedBuilding.typeData.type !== 'barricade') updateContextUI();
            }
        }

        // 타워 업데이트
        for (let i = buildings.length - 1; i >= 0; i--) {
            let b = buildings[i];
            if (b.typeData.type === 'barricade') {
                if (b.hp <= 0) {
                    if (selectedPlacedBuilding === b) { selectedPlacedBuilding = null; updateContextUI(); }
                    buildings.splice(i, 1); 
                }
                continue;
            }

            let statMultDmg = Math.pow(1.5, b.level - 1);
            let statMultRng = Math.pow(1.1, b.level - 1);
            
            b.cdTimer -= dt;
            
            if (b.typeData.type === 'economy') {
                if (b.cdTimer <= 0) {
                    let inc = Math.floor(b.typeData.income * statMultDmg);
                    gold += inc;
                    addFloatingText(`+${inc}g`, b.x, b.y - 20, "#f1c40f");
                    b.cdTimer = b.typeData.cd;
                }
                continue;
            }

            if (b.cdTimer <= 0) {
                let target = null;
                let curRange = b.typeData.range * statMultRng;
                let minDist = curRange;
                for (let e of enemies) {
                    const d = Math.hypot(e.x - b.x, e.y - b.y);
                    if (d <= minDist) { minDist = d; target = e; }
                }

                if (target) {
                    b.cdTimer = b.typeData.cd;
                    let curDmg = b.typeData.dmg * statMultDmg;

                    if (b.typeData.type === 'instant') {
                        target.hp -= curDmg;
                        projectiles.push({ type: 'beam', x1: b.x, y1: b.y, x2: target.x, y2: target.y, life: 0.1, color: b.typeData.color });
                    } else {
                        projectiles.push({
                            x: b.x, y: b.y, target: target,
                            typeData: b.typeData, dmg: curDmg, speed: 400
                        });
                    }
                }
            }
        }

        // 투사체 업데이트
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            
            if (p.type === 'beam' || p.type === 'explode') {
                p.life -= dt;
                if (p.life <= 0) projectiles.splice(i, 1);
                continue;
            }

            if (!enemies.includes(p.target)) {
                projectiles.splice(i, 1); continue;
            }

            const dx = p.target.x - p.x;
            const dy = p.target.y - p.y;
            const dist = Math.hypot(dx, dy);

            if (dist < 15) {
                let d = p.typeData;
                if (d.type === 'splash') {
                    enemies.forEach(e => {
                        if (Math.hypot(e.x - p.target.x, e.y - p.target.y) <= d.splashR) e.hp -= p.dmg;
                    });
                    projectiles.push({ type: 'explode', x: p.target.x, y: p.target.y, r: d.splashR, life: 0.15, color: d.color });
                } else {
                    p.target.hp -= p.dmg;
                }

                if (d.type === 'slow') { p.target.slowTimer = 2.0; p.target.slowFactor = d.slow; }
                else if (d.type === 'poison') { p.target.poisonTimer = 3.0; p.target.poisonDmg = d.dot * (p.dmg/d.dmg); }
                projectiles.splice(i, 1);
            } else {
                p.x += (dx / dist) * p.speed * dt;
                p.y += (dy / dist) * p.speed * dt;
            }
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].life -= dt;
            floatingTexts[i].y -= 25 * dt;
            if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
        }
    }

    // 타워 및 바리게이트 디테일 렌더링
    function drawShape(ctx, tDef, x, y, size) {
        const shape = tDef.shape;
        const color = tDef.color;
        const id = tDef.id;

        ctx.fillStyle = color;
        ctx.strokeStyle = "#1a1a2e";
        ctx.lineWidth = 2;
        ctx.beginPath();
        switch(shape) {
            case "circle": ctx.arc(x, y, size, 0, Math.PI*2); break;
            case "square": case "wall": ctx.rect(x-size, y-size, size*2, size*2); break;
            case "triangle":
                ctx.moveTo(x, y-size); ctx.lineTo(x+size, y+size); ctx.lineTo(x-size, y+size);
                ctx.closePath(); break;
            case "diamond":
                ctx.moveTo(x, y-size); ctx.lineTo(x+size, y); ctx.lineTo(x, y+size); ctx.lineTo(x-size, y);
                ctx.closePath(); break;
            case "hexagon":
                for (let i = 0; i < 6; i++) {
                    ctx.lineTo(x + size * Math.cos(i * Math.PI / 3), y + size * Math.sin(i * Math.PI / 3));
                }
                ctx.closePath(); break;
            case "star":
                for(let i=0; i<10; i++){
                    let r = i%2===0 ? size : size/2;
                    ctx.lineTo(x + r*Math.sin(i*Math.PI/5), y - r*Math.cos(i*Math.PI/5));
                }
                ctx.closePath(); break;
            case "coin":
                ctx.arc(x, y, size, 0, Math.PI*2); break;
        }
        ctx.fill(); ctx.stroke();

        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        
        if (shape === "wall") {
            ctx.beginPath();
            ctx.moveTo(x-size, y-size/2); ctx.lineTo(x+size, y-size/2);
            ctx.moveTo(x-size, y); ctx.lineTo(x+size, y);
            ctx.moveTo(x-size, y+size/2); ctx.lineTo(x+size, y+size/2);
            ctx.stroke();
        } else if (tDef.type === "poison") {
            ctx.fillStyle = "#a8ff78";
            ctx.beginPath(); ctx.arc(x, y + size/4, size/3.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x - size/3, y - size/5, size/5, 0, Math.PI*2); ctx.fill();
        } else if (tDef.type === "slow") {
            ctx.beginPath();
            ctx.moveTo(x, y-size*0.6); ctx.lineTo(x, y+size*0.6);
            ctx.moveTo(x-size*0.6, y); ctx.lineTo(x+size*0.6, y);
            ctx.moveTo(x-size*0.4, y-size*0.4); ctx.lineTo(x+size*0.4, y+size*0.4);
            ctx.moveTo(x-size*0.4, y+size*0.4); ctx.lineTo(x+size*0.4, y-size*0.4);
            ctx.stroke();
        } else if (tDef.type === "economy") {
            ctx.fillStyle = "#d4ac0d";
            ctx.beginPath(); ctx.arc(x, y, size*0.6, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#fff"; ctx.font = "bold 14px Arial"; 
            ctx.textAlign="center"; ctx.textBaseline="middle";
            ctx.fillText("$", x, y + 1);
        } else if (id === 2) { 
            ctx.beginPath(); ctx.arc(x, y, size*0.5, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x, y-size*0.8); ctx.lineTo(x, y+size*0.8); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x-size*0.8, y); ctx.lineTo(x+size*0.8, y); ctx.stroke();
        } else if (id === 5 || id === 13) {
            ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(x, y, size*0.4, 0, Math.PI*2); ctx.fill();
        } else if (id === 11) {
            ctx.fillStyle = "#f1c40f"; ctx.beginPath();
            ctx.moveTo(x, y-size*0.5); ctx.lineTo(x+size*0.4, y+size*0.4); ctx.lineTo(x-size*0.4, y+size*0.4);
            ctx.fill();
        } else if (id === 16) {
            ctx.fillStyle = "#000";
            ctx.beginPath(); ctx.arc(x-size*0.3, y-size*0.3, size*0.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+size*0.3, y-size*0.3, size*0.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x-size*0.3, y+size*0.3, size*0.2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+size*0.3, y+size*0.3, size*0.2, 0, Math.PI*2); ctx.fill();
        } else if (shape === "diamond" || shape === "star") {
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.beginPath();
            ctx.moveTo(x, y-size*0.4); ctx.lineTo(x+size*0.4, y); 
            ctx.lineTo(x, y+size*0.4); ctx.lineTo(x-size*0.4, y);
            ctx.fill();
        } else {
            ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.arc(x, y, size*0.25, 0, Math.PI*2); ctx.fill();
        }
    }

    // 렌더링 함수
    function draw() {
        ctx.drawImage(bgCanvas, 0, 0);

        ctx.fillStyle = currentTheme.center;
        ctx.beginPath(); ctx.arc(center.x, center.y, center.radius, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth=3; ctx.stroke();
        ctx.fillStyle = "white"; ctx.font = "900 16px Noto Sans KR"; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText("BASE", center.x, center.y);

        if (!selectedPlacedBuilding && mouse.x > 0 && mouse.x < 800 && mouse.y > 70 && mouse.y < 800) {
            let tDef = towerDefs.find(t => t.id === selectedBuildId);
            if (tDef && tDef.type !== 'barricade' && tDef.type !== 'economy') {
                ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
                ctx.beginPath(); ctx.arc(mouse.x, mouse.y, tDef.range, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            }
            drawShape(ctx, tDef, mouse.x, mouse.y, 20);
            ctx.globalAlpha = 0.5;
        }
        ctx.globalAlpha = 1.0;

        if (selectedPlacedBuilding && selectedPlacedBuilding.typeData.type !== 'barricade' && selectedPlacedBuilding.typeData.type !== 'economy') {
            let r = selectedPlacedBuilding.typeData.range * Math.pow(1.1, selectedPlacedBuilding.level - 1);
            ctx.fillStyle = "rgba(233, 69, 96, 0.15)";
            ctx.beginPath(); ctx.arc(selectedPlacedBuilding.x, selectedPlacedBuilding.y, r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "rgba(233, 69, 96, 0.8)";
            ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
        }

        buildings.forEach(b => {
            // 타워 그래픽 그리기 (크기가 커진 b.r이 자동으로 적용됨)
            drawShape(ctx, b.typeData, b.x, b.y, b.r);
            
            if (b.typeData.type !== 'barricade') {
                // 💡 기존의 점(dot) 대신 직관적인 LV 텍스트 표시
                ctx.font = "900 13px 'Noto Sans KR'";
                ctx.textAlign = "center";
                ctx.textBaseline = "bottom";
                
                // 가독성을 위해 글자에 검은색 굵은 테두리 추가
                ctx.lineWidth = 3;
                ctx.strokeStyle = "rgba(0,0,0,0.8)";
                ctx.strokeText(`LV.${b.level}`, b.x, b.y - b.r - 4);
                
                // 글자 내부 색상 (만렙인 3레벨은 노란색, 나머지는 흰색)
                ctx.fillStyle = b.level >= 3 ? "#f1c40f" : "#fff";
                ctx.fillText(`LV.${b.level}`, b.x, b.y - b.r - 4);
            } else {
                // 바리게이트 체력바
                ctx.fillStyle = "red"; ctx.fillRect(b.x-15, b.y-b.r-8, 30, 4);
                ctx.fillStyle = "#2ecc71"; ctx.fillRect(b.x-15, b.y-b.r-8, 30 * (b.hp/b.maxHp), 4);
            }

            // 선택된 타워 하이라이트 표시
            if (selectedPlacedBuilding === b) {
                ctx.strokeStyle = "#e94560"; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.rect(b.x-b.r-5, b.y-b.r-5, (b.r+5)*2, (b.r+5)*2); ctx.stroke();
            }
        });

        enemies.forEach(e => {
            ctx.fillStyle = e.color;
            if (e.slowTimer > 0) ctx.fillStyle = "#3498db";
            if (e.poisonTimer > 0) ctx.fillStyle = "#2ecc71";
            
            ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#000"; ctx.lineWidth = 1; ctx.stroke();
            
            ctx.fillStyle = "red"; ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, e.radius*2, 4);
            ctx.fillStyle = "#2ecc71"; ctx.fillRect(e.x - e.radius, e.y - e.radius - 8, (e.radius*2) * (e.hp / e.maxHp), 4);
        });

        // ==========================================
        // 💡 투사체 및 폭발 이펙트 (픽셀 아트 & 다이나믹 스타일)
        // ==========================================
        projectiles.forEach(p => {
            ctx.save(); // 현재 캔버스 상태(회전, 위치) 저장

            // 목표물을 향하는 각도 계산
            let angle = 0;
            if (p.target) {
                angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
            } else if (p.x2 !== undefined) {
                angle = Math.atan2(p.y2 - p.y1, p.x2 - p.x1);
            }

            if (p.type === 'beam') {
                // [레이저 계열 즉발 공격] - 네온 글로우 효과
                ctx.translate(p.x1, p.y1);
                ctx.rotate(angle);
                let dist = Math.hypot(p.x2 - p.x1, p.y2 - p.y1);
                
                // 빛 번짐(Glow) 효과
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                
                // 바깥쪽 빔 (두꺼운 색상)
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 6;
                ctx.globalAlpha = p.life / 0.1; // 서서히 사라짐
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(dist, 0); ctx.stroke();
                
                // 안쪽 빔 (얇은 흰색 코어)
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();

            } else if (p.type === 'explode') {
                // [스플래시 폭발 이펙트] - 픽셀 파편이 튀는 연출
                ctx.translate(p.x, p.y);
                let alpha = Math.max(0, p.life / 0.15); // 투명도
                ctx.globalAlpha = alpha;
                
                // 중심부 폭발광
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(0, 0, p.r * (1 - alpha/2), 0, Math.PI*2); ctx.fill();
                
                // 픽셀 파편들 (8방향으로 퍼짐)
                ctx.fillStyle = p.color === '#fff' ? '#00ffff' : '#f1c40f'; // 위성타격기면 하늘색, 나머진 노란 불꽃
                let fragmentDist = p.r * (1 - alpha); // 퍼져나가는 거리
                for(let i=0; i<8; i++) {
                    let fx = Math.cos(i * Math.PI/4) * fragmentDist;
                    let fy = Math.sin(i * Math.PI/4) * fragmentDist;
                    ctx.fillRect(fx - 4, fy - 4, 8, 8); // 픽셀 느낌의 사각형 파편
                }

            } else {
                // [일반 투사체 (날아가는 중)] - 포탑 종류별 외형
                ctx.translate(p.x, p.y);
                ctx.rotate(angle);
                
                let id = p.typeData.id;

                if (id === 11) { 
                    // 화염 방사기: 흩날리는 픽셀 불꽃 모양
                    ctx.fillStyle = Math.random() > 0.5 ? "#e74c3c" : "#f1c40f";
                    ctx.fillRect(-6, -6, 12, 12);
                    ctx.fillStyle = "#d35400";
                    ctx.fillRect(-12, -4, 8, 8); // 뒤따라오는 작은 잔상
                } 
                else if (id === 2) { 
                    // 스나이퍼: 매우 길고 빠른 고속 탄환 궤적
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(-15, -1.5, 20, 3);
                    ctx.fillStyle = "rgba(255,255,255,0.4)";
                    ctx.fillRect(-35, -1, 20, 2); // 꼬리 궤적
                } 
                else if (id === 13 || id === 5) { 
                    // 대포 & 미사일: 사각형 로켓 바디와 화염
                    ctx.fillStyle = "#95a5a6";
                    ctx.fillRect(-8, -4, 14, 8); // 로켓 몸통
                    ctx.fillStyle = "#c0392b";
                    ctx.beginPath(); ctx.moveTo(6, -4); ctx.lineTo(12, 0); ctx.lineTo(6, 4); ctx.fill(); // 빨간 탄두
                    ctx.fillStyle = "#e67e22";
                    ctx.fillRect(-12, -2, 4, 4); // 추진 화염
                } 
                else if (p.typeData.type === 'slow') { 
                    // 얼음 탑: 날아가는 눈꽃/얼음 파편
                    ctx.strokeStyle = "#87CEFA"; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(6, 6); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(-6, 6); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.stroke();
                    ctx.fillStyle = "#fff"; ctx.fillRect(-2, -2, 4, 4); // 코어
                } 
                else if (p.typeData.type === 'poison') { 
                    // 독 탑: 여러개의 방울이 뭉친 녹색 액체
                    ctx.fillStyle = "#2ecc71";
                    ctx.beginPath(); ctx.arc(2, 0, 5, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath(); ctx.arc(-3, -3, 3, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(-4, 3, 4, 0, Math.PI*2); ctx.fill();
                } 
                else if (id === 17) { 
                    // 플라즈마: 빙글빙글 도는 십자성(수리검 형태)
                    ctx.rotate(performance.now() / 100); // 팽이처럼 회전
                    ctx.fillStyle = "#00cec9";
                    ctx.fillRect(-10, -2, 20, 4);
                    ctx.fillRect(-2, -10, 4, 20);
                    ctx.fillStyle = "#fff"; ctx.fillRect(-3, -3, 6, 6);
                } 
                else if (id === 8) { 
                    // 샷건: 여러 개의 산탄 픽셀이 뭉쳐서 날아감
                    ctx.fillStyle = "#f39c12";
                    ctx.fillRect(0, -2, 5, 5);
                    ctx.fillRect(-6, -8, 4, 4);
                    ctx.fillRect(-6, 4, 4, 4);
                } 
                else if (id === 18) { 
                    // 심연의 눈: 암흑 물질 구체
                    ctx.fillStyle = "#2c2c54";
                    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = "#8e44ad"; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.stroke();
                } 
                else { 
                    // 기본 공통 탄환: 황금색 탄피와 은색 탄두 픽셀 아트
                    ctx.fillStyle = "#f1c40f";
                    ctx.fillRect(-4, -2, 8, 4);
                    ctx.fillStyle = "#ecf0f1";
                    ctx.fillRect(4, -2, 4, 4);
                }
            }
            
            ctx.restore(); // 캔버스 상태 원상복구 (다음 투사체에 영향 안 주게 함)
        });

        floatingTexts.forEach(ft => {
            ctx.fillStyle = ft.color; ctx.font = "900 16px Noto Sans KR";
            ctx.globalAlpha = ft.life; ctx.textAlign = "center";
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.globalAlpha = 1.0;
        });

        // ==============================================
        // 💡 인게임 상단 HUD (UI) 오버레이 렌더링
        // ==============================================
        ctx.fillStyle = "rgba(15, 52, 96, 0.85)"; 
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(10, 10, 780, 50, 10);
        else ctx.rect(10, 10, 780, 50); 
        ctx.fill();
        
        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px 'Noto Sans KR'";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        
        ctx.fillText(`💰 ${gold}g`, 30, 35);
        ctx.fillText(`❤️ ${lives}`, 140, 35);
        ctx.fillText(`웨이브 ${wave}/${maxWaves}`, 220, 35);
        
        ctx.fillStyle = state === 'PREP' ? "#f1c40f" : "#e74c3c";
        let timeText = state === 'PREP' ? `대기: ${Math.ceil(timer)}초` : `전투중! (남은 적: ${enemiesToSpawn.length + enemies.length})`;
        ctx.fillText(timeText, 350, 35);

        if (state === 'PREP') {
            ctx.fillStyle = isHoverStartBtn ? "#ff5c77" : "#e94560"; 
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(630, 15, 140, 40, 8);
            else ctx.rect(630, 15, 140, 40);
            ctx.fill();
            
            ctx.fillStyle = "#fff";
            ctx.textAlign = "center";
            ctx.fillText("웨이브 즉시 시작", 700, 35);
        } else {
            ctx.fillStyle = "#4a4a4a"; 
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(630, 15, 140, 40, 8);
            else ctx.rect(630, 15, 140, 40);
            ctx.fill();
            
            ctx.fillStyle = "#95a5a6";
            ctx.textAlign = "center";
            ctx.fillText("전투 진행중", 700, 35);
        }
        ctx.textAlign = "left"; 
    }

    function updateUI() {
        if(selectedPlacedBuilding && selectedPlacedBuilding.typeData.type === 'barricade') {
            ctxStats.innerText = `체력: ${Math.max(0, Math.floor(selectedPlacedBuilding.hp))} / ${selectedPlacedBuilding.maxHp}`;
        }
    }

    requestAnimationFrame(loop);

</script>
</body>
</html>
